<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Problem Sets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 0.2in;
            background-color: white;
        }

        .group-header {
            background-color: #f0f0f0;
            font-weight: bold;
            font-size: 14px;
            padding: 0.08in 0.15in;
            margin: 0.1in 0 0.08in 0;
            border-left: 4px solid #333;
            page-break-after: avoid;
        }

        .problem-set {
            border: 2px solid #333;
            padding: 0.2in;
            margin-bottom: 0.15in;
            page-break-inside: avoid;
        }

        .set-header {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.08in;
            border-bottom: 2px solid #333;
            padding-bottom: 0.05in;
        }

        .problem {
            margin: 0.08in 0;
            font-size: 15px;
            line-height: 1.4;
        }

        .problem-num {
            font-weight: bold;
            width: 0.25in;
            display: inline-block;
            font-size: 15px;
        }

        .problem-worked {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
        }

        .gray-answer {
            color: #999;
            font-weight: bold;
            border-bottom: 1px solid black;
            padding: 0 2px;
            display: inline-block;
            min-width: 0.4in;
            text-align: center;
        }

        .chain-connector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0.06in 0 0.06in 0.25in;
        }

        .answer-badge {
            background: #333;
            color: white;
            font-weight: bold;
            font-size: 15px;
            padding: 3px 10px;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .chain-arrow {
            font-size: 20px;
            color: #333;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chain-label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .code-section {
            margin-top: 0.5in;
            padding: 0.2in;
            border: 2px solid #333;
            page-break-inside: avoid;
        }

        .code-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.15in;
        }

        .code-content {
            font-size: 13px;
            line-height: 1.8;
        }

        @media print {
            body {
                padding: 0.2in;
            }
            .problem-set {
                margin-bottom: 0.15in;
                padding: 0.25in;
            }
        }
    </style>
</head>
<body>
    <script>
        const problemSets = [{"p1": "(15 + 10) - 5", "p1_worked": "(15 + 10) - 5 = 25 - 5 = <span class='gray-answer'>20</span>", "a1": 20, "p2": "(18 + 15) - 8", "a2": 25, "p3": "30 - (12 + 5)", "a3": 13, "p4": "(5 - 2) - 1", "a4": 2}, {"p1": "20 - (8 - 2)", "p1_worked": "20 - (8 - 2) = 20 - 6 = <span class='gray-answer'>14</span>", "a1": 14, "p2": "(20 + 15) - 8", "a2": 27, "p3": "35 - (12 + 8)", "a3": 15, "p4": "(15 + 5) - 2", "a4": 18}, {"p1": "(12 + 8) - 6", "p1_worked": "(12 + 8) - 6 = 20 - 6 = <span class='gray-answer'>14</span>", "a1": 14, "p2": "(25 + 18) - 8", "a2": 35, "p3": "28 - (10 + 5)", "a3": 13, "p4": "(6 - 3) - 2", "a4": 1}, {"p1": "25 - (10 - 3)", "p1_worked": "25 - (10 - 3) = 25 - 7 = <span class='gray-answer'>18</span>", "a1": 18, "p2": "(18 + 20) - 5", "a2": 33, "p3": "32 - (14 + 5)", "a3": 13, "p4": "30 - (10 - 2)", "a4": 22}, {"p1": "(18 + 6) - 8", "p1_worked": "(18 + 6) - 8 = 24 - 8 = <span class='gray-answer'>16</span>", "a1": 16, "p2": "(22 + 18) - 8", "a2": 32, "p3": "25 - (10 + 3)", "a3": 12, "p4": "(12 - 5) - 2", "a4": 5}, {"p1": "30 - (12 - 5)", "p1_worked": "30 - (12 - 5) = 30 - 7 = <span class='gray-answer'>23</span>", "a1": 23, "p2": "(20 + 16) - 6", "a2": 30, "p3": "30 - (12 + 6)", "a3": 12, "p4": "(15 + 3) - 10", "a4": 8}, {"p1": "(16 + 8) - 4", "p1_worked": "(16 + 8) - 4 = 24 - 4 = <span class='gray-answer'>20</span>", "a1": 20, "p2": "(18 + 15) - 8", "a2": 25, "p3": "28 - (16 + 8)", "a3": 4, "p4": "(7 - 4) - 2", "a4": 1}, {"p1": "28 - (10 - 2)", "p1_worked": "28 - (10 - 2) = 28 - 8 = <span class='gray-answer'>20</span>", "a1": 20, "p2": "(24 + 18) - 7", "a2": 35, "p3": "38 - (15 + 8)", "a3": 15, "p4": "(14 + 8) - 6", "a4": 16}, {"p1": "(14 + 10) - 6", "p1_worked": "(14 + 10) - 6 = 24 - 6 = <span class='gray-answer'>18</span>", "a1": 18, "p2": "(20 + 18) - 6", "a2": 32, "p3": "30 - (12 + 5)", "a3": 13, "p4": "(20 + 10) - 5", "a4": 25}, {"p1": "32 - (15 - 8)", "p1_worked": "32 - (15 - 8) = 32 - 7 = <span class='gray-answer'>25</span>", "a1": 25, "p2": "(22 + 16) - 8", "a2": 30, "p3": "35 - (10 + 8)", "a3": 17, "p4": "(18 - 2) - 3", "a4": 13}, {"p1": "(20 + 4) - 8", "p1_worked": "(20 + 4) - 8 = 24 - 8 = <span class='gray-answer'>16</span>", "a1": 16, "p2": "(18 + 14) - 6", "a2": 26, "p3": "28 - (8 + 12)", "a3": 8, "p4": "(11 - 3) - 2", "a4": 6}, {"p1": "26 - (12 - 3)", "p1_worked": "26 - (12 - 3) = 26 - 9 = <span class='gray-answer'>17</span>", "a1": 17, "p2": "(20 + 14) - 8", "a2": 26, "p3": "32 - (10 + 8)", "a3": 14, "p4": "(18 + 5) - 2", "a4": 21}, {"p1": "(18 + 8) - 10", "p1_worked": "(18 + 8) - 10 = 26 - 10 = <span class='gray-answer'>16</span>", "a1": 16, "p2": "(22 + 12) - 6", "a2": 28, "p3": "26 - (8 + 4)", "a3": 14, "p4": "(14 + 8) - 6", "a4": 16}, {"p1": "30 - (14 - 6)", "p1_worked": "30 - (14 - 6) = 30 - 8 = <span class='gray-answer'>22</span>", "a1": 22, "p2": "(24 + 16) - 8", "a2": 32, "p3": "36 - (12 + 10)", "a3": 14, "p4": "(20 + 8) - 3", "a4": 25}, {"p1": "(16 + 10) - 8", "p1_worked": "(16 + 10) - 8 = 26 - 8 = <span class='gray-answer'>18</span>", "a1": 18, "p2": "(20 + 18) - 6", "a2": 32, "p3": "34 - (10 + 6)", "a3": 18, "p4": "(16 + 5) - 2", "a4": 19}, {"p1": "28 - (9 - 2)", "p1_worked": "28 - (9 - 2) = 28 - 7 = <span class='gray-answer'>21</span>", "a1": 21, "p2": "(18 + 16) - 6", "a2": 28, "p3": "32 - (10 + 8)", "a3": 14, "p4": "(18 - 2) - 3", "a4": 13}, {"p1": "(14 + 12) - 6", "p1_worked": "(14 + 12) - 6 = 26 - 6 = <span class='gray-answer'>20</span>", "a1": 20, "p2": "(20 + 16) - 8", "a2": 28, "p3": "30 - (10 + 8)", "a3": 12, "p4": "(8 - 4) - 3", "a4": 1}, {"p1": "24 - (11 - 3)", "p1_worked": "24 - (11 - 3) = 24 - 8 = <span class='gray-answer'>16</span>", "a1": 16, "p2": "(22 + 14) - 8", "a2": 28, "p3": "34 - (12 + 4)", "a3": 18, "p4": "(14 + 6) - 2", "a4": 18}, {"p1": "(12 + 14) - 8", "p1_worked": "(12 + 14) - 8 = 26 - 8 = <span class='gray-answer'>18</span>", "a1": 18, "p2": "(20 + 18) - 8", "a2": 30, "p3": "32 - (12 + 8)", "a3": 12, "p4": "(16 + 2) - 4", "a4": 14}, {"p1": "29 - (10 - 5)", "p1_worked": "29 - (10 - 5) = 29 - 5 = <span class='gray-answer'>24</span>", "a1": 24, "p2": "(20 + 14) - 6", "a2": 28, "p3": "34 - (14 + 4)", "a3": 16, "p4": "10 - (4 + 2)", "a4": 4}, {"p1": "(18 + 6) - 4", "p1_worked": "(18 + 6) - 4 = 24 - 4 = <span class='gray-answer'>20</span>", "a1": 20, "p2": "(18 + 16) - 8", "a2": 26, "p3": "30 - (10 + 8)", "a3": 12, "p4": "(6 - 3) - 1", "a4": 2}, {"p1": "25 - (8 - 2)", "p1_worked": "25 - (8 - 2) = 25 - 6 = <span class='gray-answer'>19</span>", "a1": 19, "p2": "(20 + 12) - 6", "a2": 26, "p3": "28 - (8 + 10)", "a3": 10, "p4": "(10 - 4) - 1", "a4": 5}, {"p1": "(16 + 12) - 8", "p1_worked": "(16 + 12) - 8 = 28 - 8 = <span class='gray-answer'>20</span>", "a1": 20, "p2": "(20 + 16) - 8", "a2": 28, "p3": "32 - (12 + 10)", "a3": 10, "p4": "(16 - 3) - 2", "a4": 11}, {"p1": "27 - (12 - 4)", "p1_worked": "27 - (12 - 4) = 27 - 8 = <span class='gray-answer'>19</span>", "a1": 19, "p2": "(18 + 20) - 8", "a2": 30, "p3": "30 - (8 + 12)", "a3": 10, "p4": "(14 - 3) - 2", "a4": 9}, {"p1": "(14 + 10) - 8", "p1_worked": "(14 + 10) - 8 = 24 - 8 = <span class='gray-answer'>16</span>", "a1": 16, "p2": "(24 + 16) - 8", "a2": 32, "p3": "36 - (12 + 10)", "a3": 14, "p4": "(18 + 2) - 6", "a4": 14}, {"p1": "30 - (13 - 5)", "p1_worked": "30 - (13 - 5) = 30 - 8 = <span class='gray-answer'>22</span>", "a1": 22, "p2": "(20 + 16) - 6", "a2": 30, "p3": "32 - (12 + 6)", "a3": 14, "p4": "(18 + 2) - 4", "a4": 16}, {"p1": "(20 + 8) - 6", "p1_worked": "(20 + 8) - 6 = 28 - 6 = <span class='gray-answer'>22</span>", "a1": 22, "p2": "(22 + 14) - 8", "a2": 28, "p3": "34 - (12 + 8)", "a3": 14, "p4": "(16 + 6) - 4", "a4": 18}, {"p1": "26 - (10 - 2)", "p1_worked": "26 - (10 - 2) = 26 - 8 = <span class='gray-answer'>18</span>", "a1": 18, "p2": "(20 + 18) - 8", "a2": 30, "p3": "38 - (14 + 10)", "a3": 14, "p4": "(12 + 5) - 2", "a4": 15}, {"p1": "(12 + 10) - 4", "p1_worked": "(12 + 10) - 4 = 22 - 4 = <span class='gray-answer'>18</span>", "a1": 18, "p2": "(24 + 16) - 8", "a2": 32, "p3": "36 - (14 + 8)", "a3": 14, "p4": "(16 + 7) - 2", "a4": 21}, {"p1": "28 - (12 - 6)", "p1_worked": "28 - (12 - 6) = 28 - 6 = <span class='gray-answer'>22</span>", "a1": 22, "p2": "(22 + 16) - 6", "a2": 32, "p3": "34 - (10 + 8)", "a3": 16, "p4": "11 - (4 + 3)", "a4": 4}, {"p1": "(16 + 10) - 6", "p1_worked": "(16 + 10) - 6 = 26 - 6 = <span class='gray-answer'>20</span>", "a1": 20, "p2": "(20 + 18) - 6", "a2": 32, "p3": "38 - (12 + 10)", "a3": 16, "p4": "11 - (4 + 3)", "a4": 4}];

        const wordGroups = [
            { name: "✏️ BRAVE", startIndex: 0, endIndex: 4 },
            { name: "✏️ HAPPY", startIndex: 5, endIndex: 9 },
            { name: "✏️ FUNNY", startIndex: 10, endIndex: 14 },
            { name: "✏️ SMART", startIndex: 15, endIndex: 19 },
            { name: "✏️ BE KIND", startIndex: 20, endIndex: 25 },
            { name: "✏️ PROUD", startIndex: 26, endIndex: 30 }
        ];

        let html = '';
        let currentGroup = -1;

        problemSets.forEach((set, i) => {
            // Find the group for this set
            const groupIndex = wordGroups.findIndex(g => i >= g.startIndex && i <= g.endIndex);
            currentGroup = groupIndex;

            html += `
                <div class="problem-set">
                    <div class="set-header">Group ${groupIndex + 1}</div>

                    <div class="problem">
                        <span class="problem-num">1.</span> <span class="problem-worked">${set.p1} = ${set.p1_worked}</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">2.</span> ${set.p2} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">3.</span> ${set.p3} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">4.</span> ${set.p4} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>
                </div>
            `;
        });

        html += `
            <div class="code-section">
                <div class="code-title">🔑 LETTER CODE 🔑</div>
                <div class="code-content">
                    <strong>Use your answer from Problem 4 to find the letter:</strong><br><br>
                    1=A | 2=B | 3=C | 4=D | 5=E | 6=F | 7=G | 8=H | 9=I | 10=J<br>
                    11=K | 12=L | 13=M | 14=N | 15=O | 16=P | 17=Q | 18=R | 19=S | 20=T<br>
                    21=U | 22=V | 23=W | 24=X | 25=Y | 26=Z<br><br>
                    <strong>When you solve all 31 sets, write down all the letters in order:</strong><br>
                    <strong>Group 1 (Sets 1–5, BRAVE):</strong> _ _ _ _ _<br>
                    <strong>Group 2 (Sets 6–10, HAPPY):</strong> _ _ _ _ _<br>
                    <strong>Group 3 (Sets 11–15, FUNNY):</strong> _ _ _ _ _<br>
                    <strong>Group 4 (Sets 16–20, SMART):</strong> _ _ _ _ _<br>
                    <strong>Group 5 (Sets 21–26, BE KIND):</strong> _ _ _ _ _ _<br>
                    <strong>Group 6 (Sets 27–31, PROUD):</strong> _ _ _ _ _
                </div>
            </div>
        `;

        document.body.innerHTML = html;
    </script>
</body>
</html>
