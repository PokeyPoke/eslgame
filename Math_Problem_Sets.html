<!DOCTYPE html>
<html lang="en">
<head>

    <title>Math Problem Sets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 0.3in;
            background-color: white;
        }

        .problem-set {
            border: 2px solid #333;
            padding: 0.3in;
            margin-bottom: 0.2in;
            page-break-inside: avoid;
        }

        .set-header {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 0.15in;
            border-bottom: 2px solid #333;
            padding-bottom: 0.08in;
        }

        .problem {
            margin: 0.2in 0;
            font-size: 18px;
            line-height: 1.6;
        }

        .problem-num {
            font-weight: bold;
            width: 0.3in;
            display: inline-block;
            font-size: 18px;
        }

        .code-section {
            margin-top: 0.5in;
            padding: 0.2in;
            border: 2px solid #333;
            page-break-inside: avoid;
        }

        .code-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.15in;
        }

        .code-content {
            font-size: 13px;
            line-height: 1.8;
        }

        @media print {
            body {
                padding: 0.2in;
            }
            .problem-set {
                margin-bottom: 0.15in;
                padding: 0.25in;
            }
        }
    </style>
</head>
