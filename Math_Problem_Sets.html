<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Problem Sets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 0.2in;
            background-color: white;
        }

        .group-header {
            background-color: #f0f0f0;
            font-weight: bold;
            font-size: 14px;
            padding: 0.08in 0.15in;
            margin: 0.1in 0 0.08in 0;
            border-left: 4px solid #333;
            page-break-after: avoid;
        }

        .problem-set {
            border: 2px solid #333;
            padding: 0.2in;
            margin-bottom: 0.15in;
            page-break-inside: avoid;
        }

        .set-header {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.08in;
            border-bottom: 2px solid #333;
            padding-bottom: 0.05in;
        }

        .problem {
            margin: 0.08in 0;
            font-size: 15px;
            line-height: 1.4;
        }

        .problem-num {
            font-weight: bold;
            width: 0.25in;
            display: inline-block;
            font-size: 15px;
        }

        .problem-worked {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
        }

        .gray-answer {
            color: #999;
            font-weight: bold;
            border-bottom: 1px solid black;
            padding: 0 2px;
            display: inline-block;
            min-width: 0.4in;
            text-align: center;
        }

        .chain-connector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0.06in 0 0.06in 0.25in;
        }

        .answer-badge {
            background: #333;
            color: white;
            font-weight: bold;
            font-size: 15px;
            padding: 3px 10px;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .chain-arrow {
            font-size: 20px;
            color: #333;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chain-label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .code-section {
            margin-top: 0.5in;
            padding: 0.2in;
            border: 2px solid #333;
            page-break-inside: avoid;
        }

        .code-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.15in;
        }

        .code-content {
            font-size: 13px;
            line-height: 1.8;
        }

        @media print {
            body {
                padding: 0.2in;
            }
            .problem-set {
                margin-bottom: 0.15in;
                padding: 0.25in;
            }
        }
    </style>
</head>
<body>

        const wordGroups = [
            { name: "✏️ BRAVE", startIndex: 0, endIndex: 4 },
            { name: "✏️ HAPPY", startIndex: 5, endIndex: 9 },
            { name: "✏️ FUNNY", startIndex: 10, endIndex: 14 },
            { name: "✏️ SMART", startIndex: 15, endIndex: 19 },
            { name: "✏️ BE KIND", startIndex: 20, endIndex: 25 },
            { name: "✏️ PROUD", startIndex: 26, endIndex: 30 }
        ];

        let html = '';
        let currentGroup = -1;

        problemSets.forEach((set, i) => {
            // Find the group for this set
            const groupIndex = wordGroups.findIndex(g => i >= g.startIndex && i <= g.endIndex);
            currentGroup = groupIndex;

            html += `
                <div class="problem-set">
                    <div class="set-header">Group ${groupIndex + 1}</div>

                    <div class="problem">
                        <span class="problem-num">1.</span> <span class="problem-worked">${set.p1} = ${set.p1_worked}</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">2.</span> ${set.p2.replace(String(set.a1), '____')} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
