<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Problem Sets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 0.2in;
            background-color: white;
        }

        .group-header {
            background-color: #f0f0f0;
            font-weight: bold;
            font-size: 14px;
            padding: 0.08in 0.15in;
            margin: 0.1in 0 0.08in 0;
            border-left: 4px solid #333;
            page-break-after: avoid;
        }

        .problem-set {
            border: 2px solid #333;
            padding: 0.2in;
            margin-bottom: 0.15in;
            page-break-inside: avoid;
        }

        .set-header {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.08in;
            border-bottom: 2px solid #333;
            padding-bottom: 0.05in;
        }

        .problem {
            margin: 0.08in 0;
            font-size: 15px;
            line-height: 1.4;
        }

        .problem-num {
            font-weight: bold;
            width: 0.25in;
            display: inline-block;
            font-size: 15px;
        }

        .problem-worked {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
        }

        .gray-answer {
            color: #999;
            font-weight: bold;
            border-bottom: 1px solid black;
            padding: 0 2px;
            display: inline-block;
            min-width: 0.4in;
            text-align: center;
        }

        .chain-connector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0.06in 0 0.06in 0.25in;
        }

        .answer-badge {
            background: #333;
            color: white;
            font-weight: bold;
            font-size: 15px;
            padding: 3px 10px;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .chain-arrow {
            font-size: 20px;
            color: #333;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chain-label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .code-section {
            margin-top: 0.5in;
            padding: 0.2in;
            border: 2px solid #333;
            page-break-inside: avoid;
        }

        .code-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.15in;
        }

        .code-content {
            font-size: 13px;
            line-height: 1.8;
        }

        @media print {
            body {
                padding: 0.2in;
            }
            .problem-set {
                margin-bottom: 0.15in;
                padding: 0.25in;
            }
        }
    </style>
</head>
<body>
    <script>
        const problemSets = [{"p1":"(10 - 0)","p1_worked":"(10 - 0) = <span class='gray-answer'>10</span>","a1":10,"p2":"(10 + 12) - 0","a2":22,"p3":"22 + (4 - 8)","a3":18,"p4":"(18 - 8) - 8","a4":2},{"p1":"(14 - 0)","p1_worked":"(14 - 0) = <span class='gray-answer'>14</span>","a1":14,"p2":"(14 + 8) - 5","a2":17,"p3":"17 + (6 - 10)","a3":13,"p4":"(13 + 2) + 3","a4":18},{"p1":"(16 - 0)","p1_worked":"(16 - 0) = <span class='gray-answer'>16</span>","a1":16,"p2":"(16 + 10) - 3","a2":23,"p3":"23 + (7 - 12)","a3":18,"p4":"(18 - 8) - 9","a4":1},{"p1":"(18 - 0)","p1_worked":"(18 - 0) = <span class='gray-answer'>18</span>","a1":18,"p2":"(18 + 14) - 8","a2":24,"p3":"24 + (3 - 9)","a3":18,"p4":"(18 + 2) + 2","a4":22},{"p1":"(20 - 0)","p1_worked":"(20 - 0) = <span class='gray-answer'>20</span>","a1":20,"p2":"(20 + 9) - 4","a2":25,"p3":"25 + (8 - 13)","a3":20,"p4":"(20 - 7) - 8","a4":5},{"p1":"(12 - 0)","p1_worked":"(12 - 0) = <span class='gray-answer'>12</span>","a1":12,"p2":"(12 + 11) - 6","a2":17,"p3":"17 + (5 - 11)","a3":11,"p4":"(11 - 1) - 2","a4":8},{"p1":"(22 - 0)","p1_worked":"(22 - 0) = <span class='gray-answer'>22</span>","a1":22,"p2":"(22 + 7) - 2","a2":27,"p3":"27 + (9 - 14)","a3":22,"p4":"(22 - 10) - 11","a4":1},{"p1":"(24 - 0)","p1_worked":"(24 - 0) = <span class='gray-answer'>24</span>","a1":24,"p2":"(24 + 13) - 7","a2":30,"p3":"30 + (2 - 7)","a3":25,"p4":"(25 - 4) - 5","a4":16},{"p1":"(26 - 0)","p1_worked":"(26 - 0) = <span class='gray-answer'>26</span>","a1":26,"p2":"(26 + 15) - 9","a2":32,"p3":"32 + (10 - 15)","a3":27,"p4":"(27 - 5) - 6","a4":16},{"p1":"(28 - 0)","p1_worked":"(28 - 0) = <span class='gray-answer'>28</span>","a1":28,"p2":"(28 + 6) - 1","a2":33,"p3":"33 + (1 - 6)","a3":28,"p4":"(28 - 1) - 2","a4":25},{"p1":"(9 - 0)","p1_worked":"(9 - 0) = <span class='gray-answer'>9</span>","a1":9,"p2":"(9 + 12) - 0","a2":21,"p3":"21 + (4 - 8)","a3":17,"p4":"(17 - 5) - 6","a4":6},{"p1":"(11 - 0)","p1_worked":"(11 - 0) = <span class='gray-answer'>11</span>","a1":11,"p2":"(11 + 8) - 5","a2":14,"p3":"14 + (6 - 10)","a3":10,"p4":"(10 + 5) + 6","a4":21},{"p1":"(13 - 0)","p1_worked":"(13 - 0) = <span class='gray-answer'>13</span>","a1":13,"p2":"(13 + 10) - 3","a2":20,"p3":"20 + (7 - 12)","a3":15,"p4":"(15 - 0) - 1","a4":14},{"p1":"(15 - 0)","p1_worked":"(15 - 0) = <span class='gray-answer'>15</span>","a1":15,"p2":"(15 + 14) - 8","a2":21,"p3":"21 + (3 - 9)","a3":15,"p4":"(15 - 0) - 1","a4":14},{"p1":"(17 - 0)","p1_worked":"(17 - 0) = <span class='gray-answer'>17</span>","a1":17,"p2":"(17 + 9) - 4","a2":22,"p3":"22 + (8 - 13)","a3":17,"p4":"(17 + 4) + 4","a4":25},{"p1":"(19 - 0)","p1_worked":"(19 - 0) = <span class='gray-answer'>19</span>","a1":19,"p2":"(19 + 11) - 6","a2":24,"p3":"24 + (5 - 11)","a3":18,"p4":"(18 + 0) + 1","a4":19},{"p1":"(21 - 0)","p1_worked":"(21 - 0) = <span class='gray-answer'>21</span>","a1":21,"p2":"(21 + 7) - 2","a2":26,"p3":"26 + (9 - 14)","a3":21,"p4":"(21 - 4) - 4","a4":13},{"p1":"(23 - 0)","p1_worked":"(23 - 0) = <span class='gray-answer'>23</span>","a1":23,"p2":"(23 + 13) - 7","a2":29,"p3":"29 + (2 - 7)","a3":24,"p4":"(24 - 11) - 12","a4":1},{"p1":"(25 - 0)","p1_worked":"(25 - 0) = <span class='gray-answer'>25</span>","a1":25,"p2":"(25 + 15) - 9","a2":31,"p3":"31 + (10 - 15)","a3":26,"p4":"(26 - 4) - 4","a4":18},{"p1":"(27 - 0)","p1_worked":"(27 - 0) = <span class='gray-answer'>27</span>","a1":27,"p2":"(27 + 6) - 1","a2":32,"p3":"32 + (1 - 6)","a3":27,"p4":"(27 - 3) - 4","a4":20},{"p1":"(8 - 0)","p1_worked":"(8 - 0) = <span class='gray-answer'>8</span>","a1":8,"p2":"(8 + 12) - 0","a2":20,"p3":"20 + (4 - 8)","a3":16,"p4":"(16 - 7) - 7","a4":2},{"p1":"(7 - 0)","p1_worked":"(7 - 0) = <span class='gray-answer'>7</span>","a1":7,"p2":"(7 + 8) - 5","a2":10,"p3":"10 + (6 - 10)","a3":6,"p4":"(6 - 0) - 1","a4":5},{"p1":"(30 - 0)","p1_worked":"(30 - 0) = <span class='gray-answer'>30</span>","a1":30,"p2":"(30 + 10) - 3","a2":37,"p3":"37 + (7 - 12)","a3":32,"p4":"(32 - 10) - 11","a4":11},{"p1":"(6 - 0)","p1_worked":"(6 - 0) = <span class='gray-answer'>6</span>","a1":6,"p2":"(6 + 14) - 8","a2":12,"p3":"12 + (3 - 9)","a3":6,"p4":"(6 + 1) + 2","a4":9},{"p1":"(32 - 0)","p1_worked":"(32 - 0) = <span class='gray-answer'>32</span>","a1":32,"p2":"(32 + 9) - 4","a2":37,"p3":"37 + (8 - 13)","a3":32,"p4":"(32 - 14) - 14","a4":4},{"p1":"(5 - 0)","p1_worked":"(5 - 0) = <span class='gray-answer'>5</span>","a1":5,"p2":"(5 + 14) - 7","a2":12,"p3":"12 + (4 - 8)","a3":8,"p4":"(8 + 3) + 3","a4":14},{"p1":"(33 - 0)","p1_worked":"(33 - 0) = <span class='gray-answer'>33</span>","a1":33,"p2":"(33 + 7) - 2","a2":38,"p3":"38 + (9 - 14)","a3":33,"p4":"(33 - 8) - 9","a4":16},{"p1":"(31 - 0)","p1_worked":"(31 - 0) = <span class='gray-answer'>31</span>","a1":31,"p2":"(31 + 13) - 7","a2":37,"p3":"37 + (2 - 7)","a3":32,"p4":"(32 - 7) - 7","a4":18},{"p1":"(29 - 0)","p1_worked":"(29 - 0) = <span class='gray-answer'>29</span>","a1":29,"p2":"(29 + 15) - 9","a2":35,"p3":"35 + (10 - 15)","a3":30,"p4":"(30 - 7) - 8","a4":15},{"p1":"(35 - 0)","p1_worked":"(35 - 0) = <span class='gray-answer'>35</span>","a1":35,"p2":"(35 - 10) + 7","a2":32,"p3":"32 + (3 - 8)","a3":27,"p4":"(27 - 3) - 3","a4":21},{"p1":"(36 - 0)","p1_worked":"(36 - 0) = <span class='gray-answer'>36</span>","a1":36,"p2":"(36 - 12) + 6","a2":30,"p3":"30 + (2 - 7)","a3":25,"p4":"(25 - 10) - 11","a4":4}];

        const wordGroups = [
            { name: "✏️ BRAVE", startIndex: 0, endIndex: 4 },
            { name: "✏️ HAPPY", startIndex: 5, endIndex: 9 },
            { name: "✏️ FUNNY", startIndex: 10, endIndex: 14 },
            { name: "✏️ SMART", startIndex: 15, endIndex: 19 },
            { name: "✏️ BE KIND", startIndex: 20, endIndex: 25 },
            { name: "✏️ PROUD", startIndex: 26, endIndex: 30 }
        ];

        let html = '';
        let currentGroup = -1;

        problemSets.forEach((set, i) => {
            // Find the group for this set
            const groupIndex = wordGroups.findIndex(g => i >= g.startIndex && i <= g.endIndex);
            currentGroup = groupIndex;

            html += `
                <div class="problem-set">
                    <div class="set-header">Group ${groupIndex + 1}</div>

                    <div class="problem">
                        <span class="problem-num">1.</span> <span class="problem-worked">${set.p1} = ${set.p1_worked}</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">2.</span> ${set.p2.replace(String(set.a1), '____')} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">3.</span> ${set.p3.replace(String(set.a2), '____')} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">4.</span> ${set.p4.replace(String(set.a3), '____')} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>
                </div>
            `;
        });

        html += `
            <div class="code-section">
                <div class="code-title">🔑 LETTER CODE 🔑</div>
                <div class="code-content">
                    <strong>Use your answer from Problem 4 to find the letter:</strong><br><br>
                    1=A | 2=B | 3=C | 4=D | 5=E | 6=F | 7=G | 8=H | 9=I | 10=J<br>
                    11=K | 12=L | 13=M | 14=N | 15=O | 16=P | 17=Q | 18=R | 19=S | 20=T<br>
                    21=U | 22=V | 23=W | 24=X | 25=Y | 26=Z<br><br>
                    <strong>When you solve all 31 sets, write down all the letters in order:</strong><br>
                    <strong>Group 1 (Sets 1–5, BRAVE):</strong> _ _ _ _ _<br>
                    <strong>Group 2 (Sets 6–10, HAPPY):</strong> _ _ _ _ _<br>
                    <strong>Group 3 (Sets 11–15, FUNNY):</strong> _ _ _ _ _<br>
                    <strong>Group 4 (Sets 16–20, SMART):</strong> _ _ _ _ _<br>
                    <strong>Group 5 (Sets 21–26, BE KIND):</strong> _ _ _ _ _ _<br>
                    <strong>Group 6 (Sets 27–31, PROUD):</strong> _ _ _ _ _
                </div>
            </div>
        `;

        document.body.innerHTML = html;
    </script>
</body>
</html>
