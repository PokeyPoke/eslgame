<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Problem Sets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 0.2in;
            background-color: white;
        }

        .group-header {
            background-color: #f0f0f0;
            font-weight: bold;
            font-size: 14px;
            padding: 0.08in 0.15in;
            margin: 0.1in 0 0.08in 0;
            border-left: 4px solid #333;
            page-break-after: avoid;
        }

        .problem-set {
            border: 2px solid #333;
            padding: 0.2in;
            margin-bottom: 0.15in;
            page-break-inside: avoid;
        }

        .set-header {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.08in;
            border-bottom: 2px solid #333;
            padding-bottom: 0.05in;
        }

        .problem {
            margin: 0.08in 0;
            font-size: 15px;
            line-height: 1.4;
        }

        .problem-num {
            font-weight: bold;
            width: 0.25in;
            display: inline-block;
            font-size: 15px;
        }

        .problem-worked {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
        }

        .gray-answer {
            color: #999;
            font-weight: bold;
            border-bottom: 1px solid black;
            padding: 0 2px;
            display: inline-block;
            min-width: 0.4in;
            text-align: center;
        }

        .chain-connector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0.06in 0 0.06in 0.25in;
        }

        .answer-badge {
            background: #333;
            color: white;
            font-weight: bold;
            font-size: 15px;
            padding: 3px 10px;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .chain-arrow {
            font-size: 20px;
            color: #333;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chain-label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .code-section {
            margin-top: 0.5in;
            padding: 0.2in;
            border: 2px solid #333;
            page-break-inside: avoid;
        }

        .code-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0.15in;
        }

        .code-content {
            font-size: 13px;
            line-height: 1.8;
        }

        @media print {
            body {
                padding: 0.2in;
            }
            .problem-set {
                margin-bottom: 0.15in;
                padding: 0.25in;
            }
        }
    </style>
</head>
<body>
    <script>

,"a4":6},{"p1":"(9 + 12) - 5","p1_worked":"(9 + 12) - 5 = <span class='gray-answer'>16</span>","a1":16,"p2":"(16 + 8) - 5","a2":19,"p3":"19 + (6 - 10)","a3":15,"p4":"(15 + 3) + 3","a4":21},{"p1":"(10 + 11) - 4","p1_worked":"(10 + 11) - 4 = <span class='gray-answer'>17</span>","a1":17,"p2":"(17 + 10) - 3","a2":24,"p3":"24 + (7 - 12)","a3":19,"p4":"(19 - 4) - 1","a4":14},{"p1":"(12 + 7) - 3","p1_worked":"(12 + 7) - 3 = <span class='gray-answer'>16</span>","a1":16,"p2":"(16 + 14) - 8","a2":22,"p3":"22 + (3 - 9)","a3":16,"p4":"(16 - 1) - 1","a4":14},{"p1":"(15 + 6) - 4","p1_worked":"(15 + 6) - 4 = <span class='gray-answer'>17</span>","a1":17,"p2":"(17 + 9) - 4","a2":22,"p3":"22 + (8 - 13)","a3":17,"p4":"(17 + 4) + 4","a4":25},{"p1":"(14 + 8) - 6","p1_worked":"(14 + 8) - 6 = <span class='gray-answer'>16</span>","a1":16,"p2":"(16 + 11) - 6","a2":21,"p3":"21 + (5 - 11)","a3":15,"p4":"(15 + 2) + 2","a4":19},{"p1":"(13 + 10) - 5","p1_worked":"(13 + 10) - 5 = <span class='gray-answer'>18</span>","a1":18,"p2":"(18 + 7) - 2","a2":23,"p3":"23 + (9 - 14)","a3":18,"p4":"(18 - 3) - 2","a4":13},{"p1":"(11 + 9) - 4","p1_worked":"(11 + 9) - 4 = <span class='gray-answer'>16</span>","a1":16,"p2":"(16 + 13) - 7","a2":22,"p3":"22 + (2 - 7)","a3":17,"p4":"(17 - 9) - 8","a4":0},{"p1":"(16 + 4) - 2","p1_worked":"(16 + 4) - 2 = <span class='gray-answer'>18</span>","a1":18,"p2":"(18 + 15) - 9","a2":24,"p3":"24 + (10 - 15)","a3":19,"p4":"(19 + 0) - 1","a4":18},{"p1":"(18 + 6) - 4","p1_worked":"(18 + 6) - 4 = <span class='gray-answer'>20</span>","a1":20,"p2":"(20 + 6) - 1","a2":25,"p3":"25 + (1 - 6)","a3":20,"p4":"(20 - 0) - 0","a4":20},{"p1":"(10 + 8) - 3","p1_worked":"(10 + 8) - 3 = <span class='gray-answer'>15</span>","a1":15,"p2":"(15 + 12) - 0","a2":27,"p3":"27 + (4 - 8)","a3":23,"p4":"(23 - 10) - 11","a4":2},{"p1":"(12 + 5) - 2","p1_worked":"(12 + 5) - 2 = <span class='gray-answer'>15</span>","a1":15,"p2":"(15 + 8) - 5","a2":18,"p3":"18 + (6 - 10)","a3":14,"p4":"(14 - 4) - 5","a4":5},{"p1"         const wordGroups = [
            { name: "✏️ BRAVE", startIndex: 0, endIndex: 4 },
            { name: "✏️ HAPPY", startIndex: 5, endIndex: 9 },
            { name: "✏️ FUNNY", startIndex: 10, endIndex: 14 },
            { name: "✏️ SMART", startIndex: 15, endIndex: 19 },
            { name: "✏️ BE KIND", startIndex: 20, endIndex: 25 },
            { name: "✏️ PROUD", startIndex: 26, endIndex: 30 }
        ];

        let html = '';
        let currentGroup = -1;

        problemSets.forEach((set, i) => {
            // Find the group for this set
            const groupIndex = wordGroups.findIndex(g => i >= g.startIndex && i <= g.endIndex);
            currentGroup = groupIndex;

            html += `
                <div class="problem-set">
                    <div class="set-header">Group ${groupIndex + 1}</div>

                    <div class="problem">
                        <span class="problem-num">1.</span> <span class="problem-worked">${set.p1_worked}</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">2.</span> ${set.p2.replace(String(set.a1), '____')} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">3.</span> ${set.p3.replace(String(set.a2), '____')} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>

                    <div class="problem">
                        <span class="problem-num">4.</span> ${set.p4.replace(String(set.a3), '____')} = <span style="width: 0.5in; display: inline-block;">&nbsp;</span>
                    </div>
                </div>
            `;
        });

        html += `
            <div class="code-section">
                <div class="code-title">🔑 LETTER CODE 🔑</div>
                <div class="code-content">
                    <strong>Use your answer from Problem 4 to find the letter:</strong><br><br>
                    1=A | 2=B | 3=C | 4=D | 5=E | 6=F | 7=G | 8=H | 9=I | 10=J<br>
                    11=K | 12=L | 13=M | 14=N | 15=O | 16=P | 17=Q | 18=R | 19=S | 20=T<br>
                    21=U | 22=V | 23=W | 24=X | 25=Y | 26=Z<br><br>

                    <strong>Group 2 (Sets 6–10, HAPPY):</strong> _ _ _ _ _<br>

        `;

        document.body.innerHTML = html;
    </script>
</body>
</html>
