<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Shapes - Student Sets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 0.1in;
            background-color: white;
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 0.05in;
        }

        .shape-set {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .shapes-grid {
            display: grid;
            grid-template-columns: repeat(5, 2.4cm);
            gap: 0;
        }

        .shape-card {
            width: 2.4cm;
            height: 2.4cm;
            border: 2px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
        }

        .shape-card svg {
            width: 85%;
            height: 85%;
        }

        @media print {
            body {
                padding: 0.05in;
                display: grid;
                grid-template-columns: repeat(2, auto);
                gap: 0.05in;
            }
        }
    </style>
</head>
