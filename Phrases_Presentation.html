<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Common English Phrases for Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FF6B9D 0%, #FFC75F 50%, #845EC2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .presentation-container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border: 8px solid #FF6B9D;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .phrase-slide {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .phrase-slide.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .phrase-number {
            font-family: 'Bangers', cursive;
            font-size: 2rem;
            color: #845EC2;
            margin-bottom: 10px;
        }

        .phrase-text {
            font-size: 4rem;
            font-weight: 700;
            color: #FF6B9D;
            line-height: 1.2;
            text-shadow: 3px 3px 0px rgba(132, 94, 194, 0.2);
            font-family: 'Fredoka', sans-serif;
        }

        .phrase-text.long {
            font-size: 3rem;
        }

        .phrase-translation {
            font-size: 1.5rem;
            color: #666;
            font-style: italic;
            margin-top: 20px;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            padding: 15px 30px;
            background: linear-gradient(135deg, #FF6B9D 0%, #FFC75F 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0px #C45C7E;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #C45C7E;
        }

        button:hover {
            opacity: 0.95;
        }

        .slide-counter {
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            color: #845EC2;
            min-width: 100px;
            text-align: center;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            color: #FF6B9D;
            text-shadow: 3px 3px 0px rgba(132, 94, 194, 0.2);
            letter-spacing: 2px;
        }

        .emoji-decoration {
            font-size: 3rem;
            margin: 0 10px;
        }

        @media print {
            body {
                padding: 0;
                background: white;
            }
            .presentation-container {
                page-break-inside: avoid;
                box-shadow: none;
                border: none;
                padding: 40px;
            }
            .controls, .header {
                display: none;
            }
        }

        @media (max-width: 1024px) {
            .phrase-text {
                font-size: 2.5rem;
            }
            .phrase-text.long {
                font-size: 2rem;
            }
            .presentation-container {
                padding: 30px;
                min-height: 500px;
            }
        }

        @media (max-width: 768px) {
            .phrase-text {
                font-size: 2rem;
            }
            .phrase-text.long {
                font-size: 1.5rem;
            }
            .presentation-container {
                padding: 20px;
            }
            button {
                font-size: 1.2rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">✨ 30 Common Phrases ✨</div>
        <button onclick="toggleFullscreen()" title="Fullscreen">🖥️</button>
    </div>

    <div class="presentation-container">
        <div id="slidesContainer"></div>

        <div class="controls">
            <button onclick="previousSlide()">← Back</button>
            <div class="slide-counter"><span id="currentSlide">1</span> / <span id="totalSlides">30</span></div>
            <button onclick="nextSlide()">Next →</button>
        </div>
    </div>

    <script>
        const phrases = [
            { phrase: "Hello!", translation: "Hola / Olá" },
            { phrase: "My name is...", translation: "Mi nombre es..." },
            { phrase: "What is your name?", translation: "¿Cuál es tu nombre?" },
            { phrase: "Nice to meet you!", translation: "¡Encantado de conocerte!" },
            { phrase: "How are you?", translation: "¿Cómo estás?" },
            { phrase: "I'm fine, thank you!", translation: "¡Estoy bien, gracias!" },
            { phrase: "Thank you", translation: "Gracias" },
            { phrase: "Thank you very much", translation: "Muchas gracias" },
            { phrase: "You're welcome", translation: "De nada" },
            { phrase: "Please", translation: "Por favor" },
            { phrase: "Excuse me", translation: "Disculpe" },
            { phrase: "I'm sorry", translation: "Lo siento" },
            { phrase: "Good morning", translation: "Buenos días" },
            { phrase: "Good afternoon", translation: "Buenas tardes" },
            { phrase: "Good night", translation: "Buenas noches" },
            { phrase: "See you later!", translation: "¡Hasta luego!" },
            { phrase: "What is this?", translation: "¿Qué es esto?" },
            { phrase: "Where is the bathroom?", translation: "¿Dónde está el baño?" },
            { phrase: "Can I have...?", translation: "¿Puedo tener...?" },
            { phrase: "I like this!", translation: "¡Me gusta esto!" },
            { phrase: "I don't like this", translation: "No me gusta esto" },
            { phrase: "This is fun!", translation: "¡Esto es divertido!" },
            { phrase: "Let's play!", translation: "¡Vamos a jugar!" },
            { phrase: "Can you help me?", translation: "¿Puedes ayudarme?" },
            { phrase: "How old are you?", translation: "¿Cuántos años tienes?" },
            { phrase: "I'm happy!", translation: "¡Estoy feliz!" },
            { phrase: "I'm sad", translation: "Estoy triste" },
            { phrase: "Do you like...?", translation: "¿Te gusta...?" },
            { phrase: "Let's be friends!", translation: "¡Seamos amigos!" },
            { phrase: "Great job! 🌟", translation: "¡Buen trabajo!" }
        ];

        let currentSlide = 0;

        function createSlides() {
            const container = document.getElementById('slidesContainer');
            phrases.forEach((phraseData, index) => {
                const slide = document.createElement('div');
                slide.className = 'phrase-slide';
                if (index === 0) slide.classList.add('active');

                slide.innerHTML = `
                    <div class="phrase-number">Phrase ${index + 1}</div>
                    <div class="phrase-text ${phraseData.phrase.length > 20 ? 'long' : ''}">
                        ${phraseData.phrase}
                    </div>
                    <div class="phrase-translation">${phraseData.translation}</div>
                `;
                container.appendChild(slide);
            });

            document.getElementById('totalSlides').textContent = phrases.length;
        }

        function showSlide(n) {
            const slides = document.querySelectorAll('.phrase-slide');
            if (n >= slides.length) currentSlide = 0;
            if (n < 0) currentSlide = slides.length - 1;

            slides.forEach(slide => slide.classList.remove('active'));
            slides[currentSlide].classList.add('active');
            document.getElementById('currentSlide').textContent = currentSlide + 1;
        }

        function nextSlide() {
            currentSlide++;
            showSlide(currentSlide);
        }

        function previousSlide() {
            currentSlide--;
            showSlide(currentSlide);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') previousSlide();
        });

        createSlides();
    </script>
</body>
</html>
