<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Shapes - Student Sets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 0.1in;
            background-color: white;
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 0.05in;
        }

        .shape-set {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .shapes-grid {
            display: grid;
            grid-template-columns: repeat(5, 2.4cm);
            gap: 0;
        }

        .shape-card {
            width: 2.4cm;
            height: 2.4cm;
            border: 2px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
        }

        .shape-card svg {
            width: 85%;
            height: 85%;
        }

        @media print {
            body {
                padding: 0.05in;
                display: grid;
                grid-template-columns: repeat(2, auto);
                gap: 0.05in;
            }
        }
    </style>
</head>
<body>
    <!-- SET 1 -->
    <div class="shape-set">
        <div class="shapes-grid">
            <!-- Sphere -->
            <div class="shape-card"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="#e8e8e8" stroke="#333" stroke-width="2"/><ellipse cx="50" cy="35" rx="35" ry="12" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="2,2"/></svg></div>

            <!-- Triangular Pyramid (Tetrahedron) -->
            <div class="shape-card"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M 50 15 L 35 60 L 65 60 Z" fill="#e8e8e8" stroke="#333" stroke-width="2"/><path d="M 50 15 L 65 60 L 75 55 Z" stroke="#333" stroke-width="2" fill="#d9d9d9"/><path d="M 35 60 L 65 60 L 75 55 Z" stroke="#333" stroke-width="2" fill="#f5f5f5"/></svg></div>
